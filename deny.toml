[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path-only and unpublished, so they have no
# version requirement to wildcard against. Third-party wildcards still fail.
allow-wildcard-paths = true
deny = [
    # Phase 0 policy: no OpenSSL anywhere in the tree.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
