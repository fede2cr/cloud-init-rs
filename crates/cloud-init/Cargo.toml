[package]
name = "cloud-init"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "cloud-init command line interface (Rust port)"

[[bin]]
name = "cloud-init"
path = "src/main.rs"

# This crate is cargo-deb's entry point for the whole workspace: `cargo deb -p
# cloud-init` packages all three binaries. See packaging/build-deb.sh.
[package.metadata.deb]
name = "cloud-init-rs"
maintainer = "Álvaro Figueroa <alvaro.figueroa@microsoft.com>"
copyright = "2026 cloud-init-rs contributors"
section = "admin"
priority = "optional"
depends = "$auto"
# Generated by packaging/build-deb.sh, because the version comes from the git
# tag. Not in the repo, so `cargo deb` only works through that script.
changelog = "../../packaging/changelog.Debian"
# Not /usr/bin: this package installs beside the Python cloud-init and must not
# own a path that one already owns. Everything lands under exactly two prefixes,
# /usr/libexec/cloud-init-rs/ and /usr/share/, which packaging/build-deb.sh
# asserts mechanically after the build.
#
# Binary sources are resolved against the workspace target directory; every
# other source is relative to this manifest, hence the ../../.
assets = [
    ["target/release/cloud-init", "usr/libexec/cloud-init-rs/", "755"],
    ["target/release/cloud-id", "usr/libexec/cloud-init-rs/", "755"],
    ["target/release/cloud-init-per", "usr/libexec/cloud-init-rs/", "755"],
    # Early-boot pair. Inert here: systemd only scans
    # /usr/lib/systemd/system-generators, and ds-identify is only ever run by
    # the generator, so shipping them under libexec cannot affect a boot.
    ["target/release/ds-identify", "usr/libexec/cloud-init-rs/", "755"],
    ["target/release/cloud-init-generator", "usr/libexec/cloud-init-rs/", "755"],
    # The filesystem contract and the tmpfiles fragment generated from it.
    # `devel verify-layout` does not read these — the contract is compiled into
    # the binary — they are shipped so that downstream packagers and the future
    # cloud-init-rs-default package have the same source of truth, and so an
    # admin can diff what the package believes against what is on disk.
    #
    # Deliberately NOT /usr/lib/tmpfiles.d: a fragment installed there would run
    # at boot and create state directories, which is precisely the kind of
    # change this package promises not to make.
    [
        "../../packaging/filesystem-contract.toml",
        "usr/share/cloud-init-rs/filesystem-contract.toml",
        "644",
    ],
    [
        "../../systemd/tmpfiles.d/cloud-init-rs.conf",
        "usr/share/cloud-init-rs/tmpfiles.d/cloud-init-rs.conf",
        "644",
    ],
    # The file-context half of the SELinux policy module, also generated from
    # the contract. Shipped as source under /usr/share for the same reason as
    # the tmpfiles fragment, and deliberately not compiled or loaded here: the
    # coexistence package changes no labels on the system it installs onto.
    # Loading it is the job of the cloud-init-rs-selinux subpackage (PLAN §6.3).
    [
        "../../selinux/cloud-init-rs.fc",
        "usr/share/cloud-init-rs/selinux/cloud-init-rs.fc",
        "644",
    ],
    # The AppArmor profile, generated from the same contract. Deliberately NOT
    # /etc/apparmor.d: a profile installed there is loaded by apparmor.service
    # at the next boot, and this package promises to change nothing about how
    # the machine boots. Copy it there by hand to try it, or let the
    # cloud-init-rs-default package own it (PLAN §6.3). It is attached to
    # /usr/libexec/cloud-init-rs/, so it confines only this implementation.
    [
        "../../apparmor/cloud-init-rs",
        "usr/share/cloud-init-rs/apparmor/cloud-init-rs",
        "644",
    ],
    # README only. PLAN.md and everything under docs/ are development
    # documents and are deliberately not shipped.
    ["../../README.md", "usr/share/doc/cloud-init-rs/README.md", "644"],
]
extended-description = """\
cloud-init-rs is a memory-safe reimplementation of Canonical's cloud-init. It \
aims to be a drop-in replacement: the same command-line surface, the same \
state layout under /var/lib/cloud and /run/cloud-init, and output verified \
byte-for-byte against the Python implementation by a differential test suite.

This package takes over nothing. Every file it installs is under \
/usr/libexec/cloud-init-rs/ or /usr/share/, it ships no systemd unit, no \
generator and no tmpfiles fragment in any directory systemd reads, and \
/etc/cloud is neither created nor modified. It does not depend on, conflict \
with or replace the cloud-init package. Installing it therefore cannot change \
how the machine boots; run the binaries from that directory to compare them \
against the ones already on the system.

The port is not finished. The boot stages, datasources and network rendering \
work, but the configuration modules are recorded no-ops, so a machine that \
booted with this as its cloud-init would be identified and seeded but not \
actually configured. That is why the package deliberately gives you no way to \
make it try. A separate cloud-init-rs-default package will own \
/usr/bin/cloud-init and the units once the modules land.

/usr/share/cloud-init-rs/ carries the filesystem contract that both \
implementations are expected to honour, and the three files generated from \
it: the systemd-tmpfiles fragment, the SELinux file contexts, and an AppArmor \
profile for the binaries in this package. None of the three is installed \
where anything would load it. "cloud-init devel verify-layout" audits a \
running system against that contract and exits non-zero on drift."""

# The RPM half of the same package, for Azure Linux and Fedora. See
# packaging/build-rpm.sh, which drives `cargo generate-rpm -p cloud-init` from
# the workspace root.
#
# The file list is deliberately identical to [package.metadata.deb] above: the
# coexistence claim — nothing outside /usr/libexec/cloud-init-rs and /usr/share,
# no unit, no scriptlets, no relationship with the distro cloud-init — is the
# same claim on both, and packaging/build-rpm.sh asserts it against the built
# .rpm the same way build-deb.sh does against the .deb.
#
# `source` is resolved from the directory cargo is run in, which build-rpm.sh
# guarantees is the workspace root, so these are workspace-relative and carry
# no `../../` — the opposite of the deb asset paths above, which are relative to
# this manifest. Getting that backwards is a build-time error, not a silent one.
[package.metadata.generate-rpm]
name = "cloud-init-rs"
summary = "Memory-safe reimplementation of cloud-init (coexistence build)"
# Set by build-rpm.sh to <n>.azl4 or <n>.fc44: there is no rpmbuild here, so
# nothing expands %{?dist} for us and the distro tag has to be computed from
# the container's /etc/os-release.
release = "1"
# `auto` finds /usr/lib/rpm/find-requires, which rpm-build provides, so the
# package picks up the distribution's OpenSSL soname the same way the .deb
# picks up libssl3 through dpkg-shlibdeps. Never disable this: a static
# dependency list would silently stop tracking security updates.
auto-req = "auto"
# Nothing here is a shell script and there are no scriptlets, so the automatic
# /bin/sh requirement would be a dependency this package does not have.
require-sh = false
assets = [
    { source = "target/release/cloud-init", dest = "/usr/libexec/cloud-init-rs/cloud-init", mode = "755" },
    { source = "target/release/cloud-id", dest = "/usr/libexec/cloud-init-rs/cloud-id", mode = "755" },
    { source = "target/release/cloud-init-per", dest = "/usr/libexec/cloud-init-rs/cloud-init-per", mode = "755" },
    { source = "target/release/ds-identify", dest = "/usr/libexec/cloud-init-rs/ds-identify", mode = "755" },
    { source = "target/release/cloud-init-generator", dest = "/usr/libexec/cloud-init-rs/cloud-init-generator", mode = "755" },
    { source = "packaging/filesystem-contract.toml", dest = "/usr/share/cloud-init-rs/filesystem-contract.toml", mode = "644" },
    { source = "systemd/tmpfiles.d/cloud-init-rs.conf", dest = "/usr/share/cloud-init-rs/tmpfiles.d/cloud-init-rs.conf", mode = "644" },
    { source = "selinux/cloud-init-rs.fc", dest = "/usr/share/cloud-init-rs/selinux/cloud-init-rs.fc", mode = "644" },
    # Inert on both RPM targets, which are SELinux distributions. Shipped anyway
    # so that one asset list serves every package this project builds, and so a
    # downstream rebuilding for an AppArmor distro has it.
    { source = "apparmor/cloud-init-rs", dest = "/usr/share/cloud-init-rs/apparmor/cloud-init-rs", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cloud-init-rs/README.md", mode = "644", doc = true },
]

[lints]
workspace = true

# See crates/ci-url/Cargo.toml. Only the static musl tarballs use this.
[features]
vendored-openssl = [
    "ci-datasource/vendored-openssl",
    "ci-userdata/vendored-openssl",
]

[dependencies]
ci-config.workspace = true
ci-schema.workspace = true
ci-core.workspace = true
ci-datasource.workspace = true
ci-distro.workspace = true
ci-report.workspace = true
ci-log.workspace = true
ci-modules.workspace = true
ci-net.workspace = true
ci-sys.workspace = true
ci-template.workspace = true
ci-userdata.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
