[package]
name = "cloud-init"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "cloud-init command line interface (Rust port)"

[[bin]]
name = "cloud-init"
path = "src/main.rs"

# This crate is cargo-deb's entry point for the whole workspace: `cargo deb -p
# cloud-init` packages all three binaries. See packaging/build-deb.sh.
[package.metadata.deb]
name = "cloud-init-rs"
maintainer = "Álvaro Figueroa <alvaro.figueroa@microsoft.com>"
copyright = "2026 cloud-init-rs contributors"
section = "admin"
priority = "optional"
depends = "$auto"
# Generated by packaging/build-deb.sh, because the version comes from the git
# tag. Not in the repo, so `cargo deb` only works through that script.
changelog = "../../packaging/changelog.Debian"
# Not /usr/bin: this package installs beside the Python cloud-init and must not
# own a path that one already owns.
assets = [
    ["target/release/cloud-init", "usr/libexec/cloud-init-rs/", "755"],
    ["target/release/cloud-id", "usr/libexec/cloud-init-rs/", "755"],
    ["target/release/cloud-init-per", "usr/libexec/cloud-init-rs/", "755"],
    ["../../README.md", "usr/share/doc/cloud-init-rs/README.md", "644"],
]
extended-description = """\
cloud-init-rs is a memory-safe reimplementation of Canonical's cloud-init. It \
aims to be a drop-in replacement: the same command-line surface, the same \
state layout under /var/lib/cloud and /run/cloud-init, and output verified \
byte-for-byte against the Python implementation by a differential test suite.

This package takes over nothing. The binaries are installed under \
/usr/libexec/cloud-init-rs/ instead of /usr/bin, no systemd unit or generator \
is shipped, and /etc/cloud is neither created nor modified, so installing it \
cannot change how the machine boots. It does not depend on, conflict with or \
replace the cloud-init package; run the binaries from that directory to \
compare them against the ones already on the system.

The port is not finished. The boot stages are not implemented, so this cannot \
yet act as the machine's cloud-init, and the package deliberately gives you no \
way to make it try. A separate cloud-init-rs-default package will own \
/usr/bin/cloud-init and the units once the stages land."""

[lints]
workspace = true

[dependencies]
ci-config.workspace = true
ci-schema.workspace = true
ci-core.workspace = true
ci-sys.workspace = true
ci-template.workspace = true
ci-userdata.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
